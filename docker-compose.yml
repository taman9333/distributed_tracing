version: '3'

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel-collector.yaml
    ports:
      - 4317:4317
      - 4318:4318
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.71.0
    ports:
      - 16686:16686
      # - 55556:4317